[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow"
version = "0.1.0"
description = "FinFlow — Automated Personal Finance Intelligence Platform (local-first, ₹0-cost data platform)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FinFlow" }]
requires-python = ">=3.11"
keywords = ["data-engineering", "etl", "elt", "duckdb", "dbt", "airflow", "personal-finance"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pandera>=0.20",
    "PyYAML>=6.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]
dbt = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.24",
]

[project.scripts]
finflow = "finflow.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/finflow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finflow = ["py.typed", "demo/template.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008: typer.Option()/typer.Argument() in parameter defaults is the framework's
# intended pattern, not a bug-prone mutable default.
ignore = ["E501", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/finflow"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests",
]
