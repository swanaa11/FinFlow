# ============================================================================
# FinFlow merchant catalog — drives BOTH categorization (keywords) and the
# synthetic data generator (amount ranges / relative frequency).
#
# keywords: uppercase substrings used to match normalized transaction
#           descriptions. Merchant display names are Title Case.
# gen_min / gen_max / weight: generation hints (rupees / relative frequency).
# methods: plausible payment methods for this merchant.
# ============================================================================

